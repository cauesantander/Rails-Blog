# Active Storage services. The active one is chosen by ACTIVE_STORAGE_SERVICE
# (config/application.rb): "local" by default, "amazon" for S3. Tests always use "test".
test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Requires the aws-sdk-s3 gem (already in the Gemfile, loaded on demand) and the
# variables below. Credentials never live in this file: they come from the environment
# (or from an IAM role, in which case leave the keys unset).
amazon:
  service: S3
  access_key_id: <%= ENV["AWS_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("AWS_REGION", "us-east-1") %>
  bucket: <%= ENV.fetch("AWS_S3_BUCKET", "rails-blog-#{Rails.env}") %>
