# Sidekiq worker configuration (bundle exec sidekiq -C config/sidekiq.yml).
#
# Weighted queues: a worker thread picks "mailers" 4x more often than "default".
# Transactional e-mails (password reset, confirmation) must not wait behind a large
# newsletter, so they get the highest weight.
:concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY", 5) %>
:timeout: 25 # seconds given to running jobs on shutdown before they are pushed back to Redis
:queues:
  - [mailers, 4]
  - [newsletter_dispatch, 3]
  - [newsletter_delivery, 2]
  - [default, 1]
