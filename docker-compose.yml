# Local development stack: PostgreSQL + Redis + Rails (web) + Sidekiq (worker).
#
#   docker compose up --build            # sobe tudo
#   docker compose run --rm web bin/rspec # roda a suíte de testes
#
# Variables come from .env (optional, see .env.example) with safe defaults below.

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: rails-blog-dev
  env_file:
    - path: .env
      required: false
  environment:
    DB_HOST: db
    DB_USER: postgres
    DB_PASSWORD: postgres
    REDIS_URL: redis://redis:6379/0
    RAILS_LOG_TO_STDOUT: "1"
  volumes:
    - .:/rails
    - bundle:/usr/local/bundle
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  tty: true
  stdin_open: true

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    # AOF persistence: scheduled/retry jobs survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *app
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 3000"
    ports:
      - "${WEB_PORT:-3000}:3000"

  sidekiq:
    <<: *app
    command: bundle exec sidekiq -C config/sidekiq.yml

volumes:
  pgdata:
  redisdata:
  bundle:
